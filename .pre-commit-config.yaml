repos:
  - repo: local
    hooks:
      - id: black
        name: Black (locked version)
        entry: uv run --frozen black
        language: system
        types: [python]
      - id: flake8
        name: Flake8 (locked version)
        entry: uv run --frozen flake8
        language: system
        types: [python]
        args: ["--count", "--show-source", "--statistics"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: ["--failure-threshold", "error", "Dockerfile"]

  - repo: local
    hooks:
      - id: docker-compose-config
        name: docker compose config
        entry: docker compose --env-file .env.example config
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: docker-build-ci
        name: docker build (ci parity)
        entry: docker build --file Dockerfile --tag telegram-mcp:ci .
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: pytest-coverage-ci
        name: pytest with coverage (ci parity)
        entry: uv run --frozen --env-file .env.example pytest --cov --cov-report=term-missing --cov-report=xml
        language: system
        pass_filenames: false
        stages: [pre-push]
